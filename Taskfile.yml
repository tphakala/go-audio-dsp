# https://taskfile.dev
version: '3'

vars:
  BENCH_TIME: 2s

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run all tests (verbose)
    cmds:
      - go test -v ./...

  test:short:
    desc: Run all tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:noasm:
    desc: Run tests with every simd kernel tier disabled (pure-Go fallback)
    env:
      SIMD_DISABLE: all
    cmds:
      - go test -count=1 ./...

  bench:
    desc: Run all benchmarks
    cmds:
      - go test -bench=. -benchmem -benchtime={{.BENCH_TIME}} ./...

  ab:
    desc: Corpus A/B against ffmpeg afftdn (needs testdata/corpus/*.wav and ffmpeg)
    cmds:
      - go test -run TestCorpusAgainstAfftdn -v -count=1 ./denoiser

  vet:
    desc: Run go vet for amd64 and arm64
    cmds:
      - GOARCH=amd64 go vet ./...
      - GOARCH=arm64 go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  check:
    desc: Full local gate (build, vet, lint, race tests, no-asm tests)
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test:race
      - task: test:noasm
