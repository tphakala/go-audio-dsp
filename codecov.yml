# Example programs under examples/ are illustrative: a main package with a
# main() entry point and defensive error branches that the tests exercise for
# behavior but do not drive to full line coverage. They are not library code, so
# they are excluded from coverage measurement and targets.
ignore:
  - "examples/"

coverage:
  status:
    patch:
      default:
        # Some added error branches are unreachable: they follow a call whose
        # precondition an earlier validation already guarantees (for example a
        # resolved Config that the simd plan constructor then re-validates), so no
        # test can drive them. A small tolerance on the auto target keeps such a
        # defensive guard from failing the patch status without lowering the bar.
        threshold: 2%
